name: Generate official shadcn Base UI components

on:
  push:
    branches: [feat/shadcn-all-base-components]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate all official Base UI shadcn components
        run: npx --yes shadcn@latest add --all --yes --overwrite
        env:
          CI: 'true'
      - name: Normalize generated components without Radix or useEffect
        run: node scripts/normalize-shadcn.mjs
      - name: Remove cmdk and its Radix dependency tree
        run: npm uninstall cmdk --save
      - name: Verify zero Radix packages
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const radix = Object.keys(lock.packages).filter((k) => k.includes('@radix-ui/'));
          if (radix.length) throw new Error('Radix dependencies found: ' + radix.join(', '));
          console.log('No Radix packages in dependency graph.');
          NODE
      - run: npm run guard
      - run: npm run check
      - run: npm run build
      - run: npm run guard -- --dist
      - name: Commit verified generated components to stacked branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/generate-shadcn-all.yml
          git rm -f scripts/normalize-shadcn.mjs
          git add package.json package-lock.json src/components src/hooks src/lib src/styles components.json
          git commit -m "feat: install complete shadcn Base UI component collection with no Radix or effects"
          git push origin HEAD:feat/shadcn-all-base-components
