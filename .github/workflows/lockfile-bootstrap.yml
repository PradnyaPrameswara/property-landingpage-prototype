name: Resolve migration dependencies

on:
  push:
    branches: [refactor/astro-shadcn-base-ui]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve npm dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Print lockfile for migration
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const encoded = fs.readFileSync('package-lock.json').toString('base64');
          console.log('LOCKFILE_OUTPUT_BEGIN');
          for (let i = 0; i < encoded.length; i += 2048) {
            console.log('LOCKFILE_DATA:' + encoded.slice(i, i + 2048));
          }
          console.log('LOCKFILE_OUTPUT_END');
          NODE
